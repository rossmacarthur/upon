[package]
name = "benches"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
handlebars = "6.3.0"
liquid = "0.26.9"
minijinja = { version = "2.6.0", features = ["custom_syntax"] }
rand = "0.8.5"
serde = { version = "1.0.137", features = ["derive"] }
serde_json = "1.0.135"
tera = "1.20.0"
tinytemplate = "1.2.1"
upon = { path = "..", features = ["syntax"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
goldie = "0.5.0"

[[bench]]
name = "engines"
harness = false
